<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Park - Εγγραφή</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Blurred background image */
        body::before {
            content: '';
            position: fixed;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-image: url('/../../park.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            z-index: -2;
        }

        /* Overlay για καλύτερη αναγνωσιμότητα */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        /* Custom scrollbar styling */
        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.6);
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.8);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 0.95em;
        }

        .optional {
            color: #95a5a6;
            font-weight: normal;
            font-size: 0.85em;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        /* Contenteditable fake inputs - Chrome can't autofill these */
        .fake-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            min-height: 44px;
            cursor: text;
            color: #2c3e50;
        }

        .fake-input:empty:before {
            content: attr(data-placeholder);
            color: #95a5a6;
        }

        .fake-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .fake-input.error {
            border-color: #e74c3c;
        }

        .fake-input.valid {
            border-color: #2ecc71;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #e74c3c;
        }

        input:valid:not(:placeholder-shown) {
            border-color: #2ecc71;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .user-info {
            margin-top: 15px;
            padding: 15px;
            padding-top: 10px;
            background: #e8f4f8;
            border-radius: 8px;
            display: none;
            position: relative;
        }

        .user-info .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 24px;
            color: #7f8c8d;
            cursor: pointer;
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .user-info .close-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #2c3e50;
            transform: none;
            box-shadow: none;
        }

        .user-info h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.2em;
            padding-right: 30px;
        }

        .user-info p {
            color: #34495e;
            margin: 5px 0;
        }

        .user-info strong {
            color: #2c3e50;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VR Park</h1>
        <p class="subtitle">Εγγραφή Χρήστη</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="firstName">Όνομα *</label>
                <div 
                    id="firstName"
                    class="fake-input"
                    contenteditable="true"
                    data-placeholder="π.χ. Γιάννης"
                    data-required="true"
                    data-minlength="2"
                    data-maxlength="100"
                ></div>
            </div>

            <div class="form-group">
                <label for="lastName">Επίθετο *</label>
                <div 
                    id="lastName"
                    class="fake-input"
                    contenteditable="true"
                    data-placeholder="π.χ. Παπαδόπουλος"
                    data-required="true"
                    data-minlength="2"
                    data-maxlength="100"
                ></div>
            </div>

            <div class="form-group">
                <label for="email">Email / Τηλέφωνο <span class="optional">(προαιρετικό)</span></label>
                <div 
                    id="email"
                    class="fake-input"
                    contenteditable="true"
                    data-placeholder="π.χ. example@email.com ή 6912345678"
                    data-required="false"
                    data-maxlength="255"
                ></div>
            </div>

            <div class="form-group">
                <label for="age">Ηλικία *</label>
                <div 
                    id="age"
                    class="fake-input"
                    contenteditable="true"
                    data-placeholder="π.χ. 25"
                    data-required="true"
                    data-type="number"
                    data-min="1"
                    data-max="120"
                ></div>
            </div>

            <button type="submit" id="submitBtn">Εγγραφή</button>
        </form>

        <div id="message" class="message"></div>
        <div id="userInfo" class="user-info"></div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const userInfoDiv = document.getElementById('userInfo');

        // Handle contenteditable validation
        const fakeInputs = document.querySelectorAll('.fake-input');
        
        fakeInputs.forEach(input => {
            // Prevent pasting HTML
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            });

            // Enforce maxlength and number-only validation
            input.addEventListener('input', () => {
                // Save cursor position
                const sel = window.getSelection();
                const cursorPos = sel.rangeCount > 0 ? sel.getRangeAt(0).startOffset : 0;
                
                let text = input.textContent;
                let newCursorPos = cursorPos;

                // Only allow numbers for age field
                if (input.dataset.type === 'number') {
                    const cleaned = text.replace(/[^0-9]/g, '');
                    if (cleaned !== text) {
                        text = cleaned;
                        // Adjust cursor position if non-numbers were removed
                        const beforeCursor = input.textContent.substring(0, cursorPos);
                        newCursorPos = beforeCursor.replace(/[^0-9]/g, '').length;
                    }
                }

                // Enforce maxlength
                const maxLength = input.dataset.maxlength;
                if (maxLength && text.length > maxLength) {
                    text = text.substring(0, maxLength);
                    newCursorPos = Math.min(newCursorPos, maxLength);
                }

                // Update text only if changed
                if (input.textContent !== text) {
                    input.textContent = text;
                    
                    // Restore cursor position
                    if (input.firstChild) {
                        const range = document.createRange();
                        const selection = window.getSelection();
                        range.setStart(input.firstChild, Math.min(newCursorPos, text.length));
                        range.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                }

                // Validate and add visual feedback
                validateField(input);
            });

            // Handle Enter key
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });

        function validateField(field) {
            const value = field.textContent.trim();
            const required = field.dataset.required === 'true';
            const minLength = field.dataset.minlength;
            const maxLength = field.dataset.maxlength;
            const type = field.dataset.type;
            const min = field.dataset.min;
            const max = field.dataset.max;

            field.classList.remove('error', 'valid');

            if (!value && required) {
                field.classList.add('error');
                return false;
            }

            if (value) {
                if (minLength && value.length < minLength) {
                    field.classList.add('error');
                    return false;
                }

                if (type === 'number') {
                    const numValue = parseInt(value);
                    if (isNaN(numValue) || (min && numValue < min) || (max && numValue > max)) {
                        field.classList.add('error');
                        return false;
                    }
                }

                field.classList.add('valid');
            }

            return true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get form data from contenteditable divs
            const formData = {
                firstName: document.getElementById('firstName').textContent.trim(),
                lastName: document.getElementById('lastName').textContent.trim(),
                email: document.getElementById('email').textContent.trim() || null,
                age: parseInt(document.getElementById('age').textContent.trim())
            };

            // Validate all fields first
            const fields = [
                document.getElementById('firstName'),
                document.getElementById('lastName'),
                document.getElementById('age')
            ];
            
            let isValid = true;
            fields.forEach(field => {
                if (!validateField(field)) {
                    isValid = false;
                }
            });

            if (!isValid) {
                showMessage('Παρακαλώ συμπληρώστε σωστά όλα τα υποχρεωτικά πεδία', 'error');
                return;
            }

            // Additional validation
            if (!formData.firstName || !formData.lastName || !formData.age || isNaN(formData.age)) {
                showMessage('Παρακαλώ συμπληρώστε όλα τα υποχρεωτικά πεδία σωστά', 'error');
                return;
            }

            if (formData.age < 1 || formData.age > 120) {
                showMessage('Η ηλικία πρέπει να είναι μεταξύ 1 και 120 ετών', 'error');
                return;
            }

            if (formData.firstName.length < 2 || formData.lastName.length < 2) {
                showMessage('Το όνομα και επίθετο πρέπει να έχουν τουλάχιστον 2 χαρακτήρες', 'error');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Εγγραφή σε εξέλιξη...';

            try {
                const response = await fetch('/api/vrpark/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Η εγγραφή σας ολοκληρώθηκε επιτυχώς!', 'success');
                    showUserInfo(data);
                    // Clear contenteditable divs
                    document.getElementById('firstName').textContent = '';
                    document.getElementById('lastName').textContent = '';
                    document.getElementById('email').textContent = '';
                    document.getElementById('age').textContent = '';
                    // Remove validation classes
                    fakeInputs.forEach(input => input.classList.remove('error', 'valid'));
                } else {
                    // Handle specific error with userId
                    if (data.userId) {
                        showMessage(data.message || 'Το email υπάρχει ήδη', 'error');
                    } else {
                        showMessage(data.message || 'Σφάλμα κατά την εγγραφή', 'error');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Σφάλμα σύνδεσης με τον server. Παρακαλώ δοκιμάστε ξανά.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Εγγραφή';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function showUserInfo(data) {
            // Handle both camelCase and lowercase property names
            const userId = data.userId || data.userid || data.UserId;
            const firstName = data.firstName || data.firstname || data.FirstName;
            const lastName = data.lastName || data.lastname || data.LastName;
            const email = data.email || data.Email;
            const age = data.age || data.Age;

            userInfoDiv.innerHTML = `
                <button class="close-btn" onclick="closeUserInfo()" title="Κλείσιμο">&times;</button>
                <h3> Επιτυχής Εγγραφή!</h3>
                <p><strong>User ID:</strong> ${userId}</p>
                <p><strong>Όνομα:</strong> ${firstName} ${lastName}</p>
                ${email ? `<p><strong>Email:</strong> ${email}</p>` : ''}
                <p><strong>Ηλικία:</strong> ${age} ετών</p>
            `;
            userInfoDiv.style.display = 'block';
        }

        function closeUserInfo() {
            userInfoDiv.style.display = 'none';
        }
    </script>
</body>
</html>
